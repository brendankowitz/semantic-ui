[package]
name = "semantic-ui"
version = "0.1.0"
description = "SemanticUI - Dynamic LLM-Driven FHIR Application Framework"
authors = ["SemanticUI Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = [ "process", "fs-scope"] }
tokio = { version = "1", features = ["full"] }

[features]
# This feature is used for production builds where `devPath` points to the filesystem
# and CORS is enabled; `dev` builds may expose assets that would otherwise be
# private to the webview and completely break security.
#
# This value is `null` on the `dev` profile to enable devtools and debug builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
